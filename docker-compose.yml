services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gatekeep-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in root .env}
      REDIS_URL: redis://redis:6379/0
      GATEKEEP_API_KEYS: ${GATEKEEP_API_KEYS:?Set GATEKEEP_API_KEYS in root .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_GATEKEEP_API_KEY: ${VITE_GATEKEEP_API_KEY:-}
    container_name: gatekeep-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: gatekeep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data: